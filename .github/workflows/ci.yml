name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --extra test
      - run: uv run pytest -q --cov=aviasales_mcp --cov-report=term-missing
      - run: uv run ruff check .
      - run: uv run bandit -q -r src
      - name: Validate Docker Compose
        env:
          TRAVELPAYOUTS_TOKEN: ci-placeholder
          TRAVELPAYOUTS_TRS: "123456"
          TRAVELPAYOUTS_MARKER: "654321"
          MCP_BEARER_TOKEN: 0123456789abcdef0123456789abcdef
        run: docker compose config --quiet
      - run: docker build -t aviasales-mcp:ci .
